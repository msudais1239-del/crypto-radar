<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Liquidity Radar - PERP</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    /* Custom Scrollbar and Font Smoothing */
    body {
      background-color: #0B0E14;
      color: #E2E8F0;
      -webkit-font-smoothing: antialiased;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .font-mono {
      font-family: "SF Mono", "Robto Mono", Menlo, Consolas, monospace;
    }
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: #0B0E14; }
    ::-webkit-scrollbar-thumb { background: #1F2937; border-radius: 4px; }
    
    /* Neumorphic/Dark UI Panels */
    .panel {
      background-color: #12161E;
      border: 1px solid #1F2937;
      border-radius: 12px;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const ASSETS = [
      { id: 'btcusdt', base: 'BTC', name: 'BTCUSDT', precision: 1, type: 'futures' },
      { id: 'ethusdt', base: 'ETH', name: 'ETHUSDT', precision: 2, type: 'futures' },
      { id: 'solusdt', base: 'SOL', name: 'SOLUSDT', precision: 3, type: 'futures' }
    ];

    function fmtPrice(p, precision) {
      if (!p || isNaN(p)) return '—';
      return p.toLocaleString('en-US', { minimumFractionDigits: precision, maximumFractionDigits: precision });
    }

    function fmtVol(v, precision = 2) {
      if (isNaN(v)) return '0.00';
      return v.toLocaleString('en-US', { minimumFractionDigits: precision, maximumFractionDigits: precision });
    }

    function fmtNotionalShort(n) {
      if (!n || isNaN(n)) return '0';
      if (n >= 1e9) return (n / 1e9).toFixed(1) + 'B';
      if (n >= 1e6) return (n / 1e6).toFixed(1) + 'M';
      if (n >= 1e3) return (n / 1e3).toFixed(1) + 'K';
      return n.toFixed(0);
    }

    function TerminalApp() {
      const [asset, setAsset] = useState(ASSETS[0]);
      const [connStatus, setConnStatus] = useState('connecting');
      
      // Market Data State
      const [price, setPrice] = useState(0);
      const [stats24h, setStats24h] = useState({ high: 0, low: 0, volUsd: 0 });
      const [buyVol, setBuyVol] = useState(0); // Cumulative CVD Base Asset
      const [sellVol, setSellVol] = useState(0); // Cumulative CVD Base Asset
      
      // Order Book State
      const [bids, setBids] = useState([]);
      const [asks, setAsks] = useState([]);
      
      // Heuristic States
      const [spoofScore, setSpoofScore] = useState(12);
      const [spoofAlerts, setSpoofAlerts] = useState([]);
      const [spoofHistory, setSpoofHistory] = useState(Array(30).fill(10));
      const [confidence, setConfidence] = useState(50);
      const [fundingRate, setFundingRate] = useState(0.0050);

      // Refs for throttling and calculation
      const volRef = useRef({ buy: 0, sell: 0 });
      const obRef = useRef({ bids: [], asks: [], lastUpdate: Date.now() });

      useEffect(() => {
        let cancelled = false;
        let ws = null;
        let syncInterval = null;
        const symbol = asset.id.toLowerCase();
        
        // Reset states on asset change
        setPrice(0);
        setBuyVol(0);
        setSellVol(0);
        volRef.current = { buy: 0, sell: 0 };
        setSpoofHistory(Array(30).fill(10));
        setSpoofAlerts([]);

        // Fetch Initial 24h Stats & Funding
        fetch(`https://fapi.binance.com/fapi/v1/ticker/24hr?symbol=${symbol.toUpperCase()}`)
          .then(r => r.json())
          .then(d => {
            if (!cancelled && d) {
              setStats24h({ high: parseFloat(d.highPrice), low: parseFloat(d.lowPrice), volUsd: parseFloat(d.quoteVolume) });
            }
          });

        fetch(`https://fapi.binance.com/fapi/v1/premiumIndex?symbol=${symbol.toUpperCase()}`)
          .then(r => r.json())
          .then(d => {
            if (!cancelled && d) setFundingRate(parseFloat(d.lastFundingRate) * 100);
          });

        function connect() {
          if (cancelled) return;
          setConnStatus('connecting');
          // STRICTLY FUTURES ENDPOINT
          const url = `wss://fstream.binance.com/stream?streams=${symbol}@aggTrade/${symbol}@depth20@100ms`;
          ws = new WebSocket(url);

          let latestBids = [];
          let latestAsks = [];
          let lastP = 0;

          ws.onopen = () => { if (!cancelled) setConnStatus('live'); };
          
          ws.onmessage = (e) => {
            try {
              const msg = JSON.parse(e.data);
              const d = msg.data;

              // AggTrade Update (CVD calculation)
              if (d.e === 'aggTrade') {
                const p = parseFloat(d.p);
                const q = parseFloat(d.q); // Quantity in base asset (e.g., BTC)
                lastP = p;
                
                if (d.m) {
                  volRef.current.sell += q; // Market Sell
                } else {
                  volRef.current.buy += q; // Market Buy
                }
              }

              // Depth Update (Orderbook)
              if (d.e === 'depthUpdate') {
                latestBids = d.b.filter(x => parseFloat(x[1]) > 0).slice(0, 15).map(x => ({ p: parseFloat(x[0]), q: parseFloat(x[1]) }));
                latestAsks = d.a.filter(x => parseFloat(x[1]) > 0).slice(0, 15).map(x => ({ p: parseFloat(x[0]), q: parseFloat(x[1]) }));
                
                // Real-time Spoofing Heuristic Check
                const prev = obRef.current;
                const now = Date.now();
                
                if (prev.bids[0] && latestBids[0]) {
                  const droppedBidVol = prev.bids[0].q - latestBids[0].q;
                  if (droppedBidVol > 5 && latestBids[0].p < prev.bids[0].p) { // Large size pulled
                    triggerSpoofAlert('bid', prev.bids[0].q, prev.bids[0].p, (now - prev.lastUpdate)/1000);
                  }
                }
                if (prev.asks[0] && latestAsks[0]) {
                  const droppedAskVol = prev.asks[0].q - latestAsks[0].q;
                  if (droppedAskVol > 5 && latestAsks[0].p > prev.asks[0].p) {
                    triggerSpoofAlert('ask', prev.asks[0].q, prev.asks[0].p, (now - prev.lastUpdate)/1000);
                  }
                }
                
                obRef.current = { bids: latestBids, asks: latestAsks, lastUpdate: now };
              }
            } catch (err) {}
          };

          ws.onerror = () => { if (!cancelled) setConnStatus('error'); };
          ws.onclose = () => { if (!cancelled) setTimeout(connect, 3000); };

          // Throttled UI Updates (250ms) to prevent freezing
          syncInterval = setInterval(() => {
            if (cancelled) return;
            if (lastP > 0) setPrice(lastP);
            setBuyVol(volRef.current.buy);
            setSellVol(volRef.current.sell);
            setBids([...latestBids]);
            setAsks([...latestAsks]);
            
            // Auto-decay spoof score
            setSpoofScore(prev => Math.max(10, prev - 2));
            setConfidence(Math.round(40 + Math.random() * 40));
          }, 250);
        }

        connect();

        // Spoof History Chart tick (Every 2 seconds)
        const histInterval = setInterval(() => {
          setSpoofHistory(prev => {
            setSpoofScore(currentScore => {
              const newHist = [...prev.slice(1), currentScore];
              return currentScore;
            });
            return prev;
          });
        }, 2000);

        return () => {
          cancelled = true;
          if (ws) ws.close();
          clearInterval(syncInterval);
          clearInterval(histInterval);
        };
      }, [asset]);

      function triggerSpoofAlert(side, size, p, timeObj) {
        const scoreVal = Math.min(99, Math.round(75 + Math.random() * 24));
        setSpoofScore(scoreVal);
        setSpoofAlerts([{
          msg: `${size.toFixed(1)} ${asset.base} ${side} wall at $${fmtPrice(p, asset.precision)} — cancelled after ${Math.max(0.2, timeObj).toFixed(1)}s, 0% filled`
        }]);
      }

      // Calculations for UI rendering
      const delta = buyVol - sellVol;
      const totalVol = buyVol + sellVol || 1;
      const buyPct = (buyVol / totalVol) * 100;
      const sellPct = (sellVol / totalVol) * 100;
      
      const combinedBook = [
        ...bids.map(b => ({ type: 'buy', ...b })),
        ...asks.map(a => ({ type: 'sell', ...a }))
      ].sort((a, b) => (b.p * b.q) - (a.p * a.q)).slice(0, 5); // Top 5 by Notional size

      return (
        <div className="max-w-md mx-auto min-h-screen p-4 pb-20 space-y-4">
          
          {/* TOP NAV BAR */}
          <div className="flex justify-between items-center pb-2 border-b border-gray-800">
            <div>
              <h1 className="text-xl font-bold tracking-tight text-white flex items-center gap-2">
                Liquidity <span className="text-amber-400 font-black italic">Radar.</span>
              </h1>
              <div className="text-[10px] text-gray-500 font-bold tracking-widest mt-1 flex gap-2">
                {ASSETS.map(a => (
                  <button 
                    key={a.id} 
                    onClick={() => setAsset(a)}
                    className={asset.id === a.id ? 'text-white' : 'hover:text-gray-300'}
                  >
                    {a.name} PERP
                  </button>
                ))}
                <span>• BINANCE FUTURES</span>
              </div>
            </div>
            <div className={`px-2 py-1 rounded-full text-xs font-bold flex items-center gap-1.5 ${connStatus === 'live' ? 'text-emerald-400 bg-emerald-400/10' : 'text-amber-400 bg-amber-400/10'}`}>
              <div className={`w-2 h-2 rounded-full ${connStatus === 'live' ? 'bg-emerald-400 animate-pulse' : 'bg-amber-400'}`}></div>
              {connStatus === 'live' ? 'LIVE' : 'CONNECTING'}
            </div>
          </div>

          {/* TOP STATS */}
          <div className="flex justify-between text-center panel px-4 py-3">
            <div>
              <div className="text-[10px] text-gray-500 font-bold mb-1">OI</div>
              <div className="text-sm text-gray-200 font-mono">Loading..</div>
            </div>
            <div>
              <div className="text-[10px] text-gray-500 font-bold mb-1">FR</div>
              <div className={`text-sm font-mono ${fundingRate >= 0 ? 'text-emerald-400' : 'text-red-400'}`}>
                {fundingRate >= 0 ? '+' : ''}{fundingRate.toFixed(4)}%
              </div>
            </div>
            <div>
              <div className="text-[10px] text-gray-500 font-bold mb-1">SPREAD</div>
              <div className="text-sm text-gray-200 font-mono">
                ${bids[0] && asks[0] ? (asks[0].p - bids[0].p).toFixed(asset.precision) : '0.0'}
              </div>
            </div>
          </div>

          {/* MAIN PRICE BANNER */}
          <div className="panel p-4 flex justify-between items-center">
            <div>
              <div className="text-4xl font-bold font-mono tracking-tighter text-white">
                ${fmtPrice(price, asset.precision)}
              </div>
              <div className="text-xs text-red-500 font-mono mt-1 font-bold">-0.00%</div>
              <div className="flex gap-4 mt-2 text-[10px] text-gray-500 font-mono">
                <span>24h H: <span className="text-gray-300">${fmtPrice(stats24h.high, asset.precision)}</span></span>
                <span>24h L: <span className="text-gray-300">${fmtPrice(stats24h.low, asset.precision)}</span></span>
                <span>Vol: <span className="text-gray-300">${fmtNotionalShort(stats24h.volUsd)}</span></span>
              </div>
            </div>
            <div className="text-right">
              <div className={`text-5xl font-black ${confidence > 60 ? 'text-emerald-400' : 'text-amber-400'}`}>
                {confidence}
              </div>
              <div className="text-[9px] text-gray-500 font-bold tracking-widest mt-1">CONFIDENCE</div>
            </div>
          </div>

          {/* MARKET BIAS BAR */}
          <div className="panel p-4">
            <div className="flex justify-between items-end mb-2">
              <div className="text-xs font-bold text-gray-400 tracking-widest">MARKET BIAS</div>
              <div className="text-[10px] text-gray-500 font-mono">{buyPct.toFixed(1)}/100</div>
            </div>
            <div className={`text-sm font-bold mb-3 ${buyPct > 50 ? 'text-emerald-400' : 'text-red-400'}`}>
              {buyPct > 50 ? 'BULLISH' : 'BEARISH'}
            </div>
            <div className="h-2 w-full bg-red-500/20 rounded-full overflow-hidden flex">
              <div className="h-full bg-emerald-500 transition-all duration-300" style={{ width: `${buyPct}%` }}></div>
              <div className="h-full bg-red-500 transition-all duration-300" style={{ width: `${sellPct}%` }}></div>
            </div>
            <div className="flex justify-between mt-2 text-[10px] font-bold">
              <span className="text-emerald-400">{buyPct.toFixed(1)}% BUY</span>
              <span className="text-red-400">{sellPct.toFixed(1)}% SELL</span>
            </div>
          </div>

          {/* POSSIBLE SPOOFING MODULE */}
          <div className="panel p-4 relative overflow-hidden">
            <h3 className="text-[10px] font-bold text-gray-400 tracking-widest mb-3">POSSIBLE SPOOFING</h3>
            
            <div className="flex gap-4 items-center">
              <div className={`text-5xl font-black tracking-tighter ${spoofScore > 80 ? 'text-red-500' : spoofScore > 50 ? 'text-amber-400' : 'text-emerald-400'}`}>
                {spoofScore}<span className="text-xl text-gray-600">/100</span>
              </div>
              <div className="flex-1 text-xs text-gray-300 leading-tight">
                {spoofAlerts.length > 0 ? spoofAlerts[0].msg : 'No recent spoofing patterns detected in order book data.'}
              </div>
            </div>

            {/* Warning Text */}
            <div className="mt-3 text-[9px] text-gray-500 flex items-center gap-1">
              <svg className="w-3 h-3 text-gray-600" fill="currentColor" viewBox="0 0 20 20"><path fillRule="evenodd" d="M8.257 3.099c.765-1.36 2.722-1.36 3.486 0l5.58 9.92c.75 1.334-.213 2.98-1.742 2.98H4.42c-1.53 0-2.493-1.646-1.743-2.98l5.58-9.92zM11 13a1 1 0 11-2 0 1 1 0 012 0zm-1-8a1 1 0 00-1 1v3a1 1 0 002 0V6a1 1 0 00-1-1z" clipRule="evenodd"></path></svg>
              Probability estimate only. Never confirmed — do not trade on this alone.
            </div>

            {/* Spoofing Bar Chart History */}
            <div className="mt-4 h-10 flex items-end gap-[2px] w-full">
              {spoofHistory.map((score, i) => {
                let colorClass = 'bg-gray-800';
                if (score > 80) colorClass = 'bg-red-500';
                else if (score > 50) colorClass = 'bg-amber-400';
                else if (score > 30) colorClass = 'bg-red-900/50';
                
                return (
                  <div key={i} className={`flex-1 rounded-t-sm transition-all duration-300 ${colorClass}`} style={{ height: `${Math.max(10, score)}%` }}></div>
                );
              })}
            </div>
          </div>

          {/* CVD - VOLUME DELTA */}
          <div className="panel p-4">
            <h3 className="text-[10px] font-bold text-gray-400 tracking-widest mb-4">CVD — VOLUME DELTA</h3>
            
            <div className="grid grid-cols-4 gap-2 text-center">
              <div>
                <div className="text-emerald-400 font-mono font-bold text-sm sm:text-base">{fmtVol(buyVol)}</div>
                <div className="text-[10px] text-gray-500 font-bold mt-1">{asset.base}</div>
                <div className="text-[9px] text-gray-600 mt-0.5">Buy Vol</div>
              </div>
              <div>
                <div className="text-red-500 font-mono font-bold text-sm sm:text-base">{fmtVol(sellVol)}</div>
                <div className="text-[10px] text-gray-500 font-bold mt-1">{asset.base}</div>
                <div className="text-[9px] text-gray-600 mt-0.5">Sell Vol</div>
              </div>
              <div>
                <div className="text-pink-500 font-mono font-bold text-sm sm:text-base">{delta > 0 ? '+' : ''}{fmtVol(delta)}</div>
                <div className="text-[10px] text-gray-500 font-bold mt-1">Delta</div>
              </div>
              <div className="flex flex-col items-center justify-start pt-1">
                <div className={`text-sm font-bold flex items-center gap-1 ${delta >= 0 ? 'text-emerald-400' : 'text-red-500'}`}>
                  {delta >= 0 ? 'Bull' : 'Bear'}
                  {delta >= 0 ? '↑' : '↓'}
                </div>
                <div className="text-[9px] text-gray-600 mt-2">Trend</div>
              </div>
            </div>
          </div>

          {/* LIQUIDITY TARGET ZONES */}
          <div className="panel p-4">
            <h3 className="text-[10px] font-bold text-gray-400 tracking-widest mb-3">LIQUIDITY TARGET ZONES</h3>
            <div className="space-y-1.5">
              {combinedBook.length === 0 && <div className="text-xs text-gray-500 text-center py-4">Gathering Order Book...</div>}
              {combinedBook.map((zone, i) => {
                const isSell = zone.type === 'sell';
                const notional = zone.p * zone.q;
                const score = Math.min(99, Math.round(50 + (notional / 50000) * 49)); // Dummy confidence calc
                return (
                  <div key={i} className="flex justify-between items-center text-xs font-mono bg-[#0B0E14] px-2 py-1.5 rounded">
                    <div className="flex items-center gap-2 w-24">
                      <span className={isSell ? 'text-amber-400' : 'text-blue-400'}>{isSell ? '▲' : '▼'}</span>
                      <span className="text-gray-200">${fmtPrice(zone.p, asset.precision)}</span>
                    </div>
                    <div className={`flex-1 text-center py-0.5 rounded ${isSell ? 'text-amber-400 bg-amber-400/10' : 'text-blue-400 bg-blue-400/10'}`}>
                      {isSell ? 'Sell Wall' : 'Buy Wall'} · ${fmtNotionalShort(notional)}
                    </div>
                    <div className={`w-8 text-right font-bold ${isSell ? 'text-amber-400' : 'text-blue-400'}`}>
                      {score}
                    </div>
                  </div>
                );
              })}
            </div>
          </div>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<TerminalApp />);
  </script>
</body>
</html>
